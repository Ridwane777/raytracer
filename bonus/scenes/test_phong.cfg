camera: {
    resolution: { width: 800, height: 600 };
    position: { x: 0.0, y: 0.0, z: -5.0 };
    rotation: { x: 0.0, y: 0.0, z: 0.0 };
    fieldOfView: 60.0;
    antialiasing: 2;
};

primitives: {
    spheres: (
        { 
            x: -1.0, y: 0.0, z: 0.0, r: 1.0, 
            color: { r: 255, g: 0, b: 0 },
            shininess: 0.0 # Matte
        },
        { 
            x: 0.0, y: 0.0, z: 0.0, r: 1.0, 
            color: { r: 0, g: 255, b: 0 },
            shininess: 20.0, # Plastic
            specular: { r: 255, g: 255, b: 255 }
        },
        { 
            x: 1.0, y: 0.0, z: 0.0, r: 1.0, 
            color: { r: 0, g: 0, b: 255 },
            shininess: 100.0, # Metallic/Shiny
            specular: { r: 255, g: 255, b: 255 }
        }
    );
    planes: (
        { 
            axis: "Y", position: -1.0, 
            color: { r: 100, g: 100, b: 100 },
            shininess: 10.0
        }
    );
};

lights: {
    ambient: 0.2;
    point: (
        { x: 5.0, y: 5.0, z: -5.0, intensity: 0.8, color: { r: 255, g: 255, b: 255 } }
    );
};
