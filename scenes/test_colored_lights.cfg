camera:
{
    resolution: { width = 800; height = 600; };
    position: { x = 0.0; y = 0.0; z = -10.0; };
    rotation: { x = 0.0; y = 0.0; z = 0.0; };
    fieldOfView = 60.0;
    antialiasing = 1;
};

primitives:
{
    spheres = (
        {
            x = 0.0; y = 0.0; z = -20.0; // Devant la caméra !
            r = 3.0;
            color = { r = 255; g = 255; b = 255; };
        }
    );
};

lights:
{
    ambient = 0.1;
    diffuse = 0.8;
    point = (
        {
            x = -10.0; y = 10.0; z = -15.0;
            color = { r = 255; g = 0; b = 0; }; // Rouge
        },
        {
            x = 10.0; y = -10.0; z = -15.0;
            color = { r = 0; g = 0; b = 255; }; // Bleu
        }
    );
};
