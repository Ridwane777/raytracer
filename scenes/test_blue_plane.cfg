camera:
{
    resolution: { width = 800; height = 600; };
    position: { x = 0.0; y = 3.0; z = 20.0; }; // Caméra légèrement en hauteur
    rotation: { x = 0.0; y = 0.0; z = 0.0; };
    fieldOfView = 60.0;
    antialiasing = 1;
};

primitives:
{
    planes = (
        {
            axis = "Y";
            position = -5.0; // Le "sol" ou "l'eau" bleu transparent
            color = { r = 0; g = 100; b = 255; }; // Bleu clair
            transparency = 0.8; // Très transparent
        }
    );
    spheres = (
        {
            x = 0.0; y = 0.0; z = 0.0; // Sphère qui flotte "au-dessus" du plan (Y=0 > Y=-5)
            r = 3.0;
            color = { r = 0; g = 255; b = 0; }; // Verte
        },
        {
            x = 0.0; y = -10.0; z = -5.0; // Sphère immergée "sous" le plan pour bien voir la transparence (Y=-10 < Y=-5)
            r = 3.0;
            color = { r = 255; g = 0; b = 0; }; // Rouge
        }
    );
};

lights:
{
    ambient = 0.3;
    diffuse = 0.8;
    point = (
        {
            x = 10.0; y = 20.0; z = 10.0;
            color = { r = 255; g = 255; b = 255; };
        }
    );
};
