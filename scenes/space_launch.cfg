# Scene 2: Space Launch Pad
# Fusee low-poly sur une station spatiale avec planetes et anneaux
camera:
{
  resolution = { width = 1920; height = 1080; };
  position = { x = 35.0; y = -110.0; z = 0.0; };
  rotation = { x = 80.0; y = 0.0; z = -15.0; };
  fieldOfView = 58.0;
  antialiasing = 4;
};

primitives:
{
  planes = (
    # Sol metallique de la station
    { axis = "Z"; position = -25.0; color = { r = 30; g = 35; b = 45; }; reflectivity = 0.4; shininess = 30.0; }
  );

  spheres = (
    # Planete geante en arriere-plan (lune)
    { x = 200.0; y = 200.0; z = 80.0; r = 80.0; color = { r = 180; g = 170; b = 150; }; reflectivity = 0.05; shininess = 5.0; },
    # Petite planete rouge (Mars-like)
    { x = -150.0; y = 180.0; z = 60.0; r = 35.0; color = { r = 200; g = 80; b = 50; }; reflectivity = 0.08; shininess = 8.0; },
    # Etoile brillante (soleil lointain)
    { x = 0.0; y = 400.0; z = 200.0; r = 20.0; color = { r = 255; g = 240; b = 180; }; reflectivity = 0.0; shininess = 0.0; }
  );

  toruses = (
    # Anneau orbital autour de la planete
    {
      x = 200.0; y = 200.0; z = 80.0;
      r1 = 110.0; r2 = 8.0;
      color = { r = 180; g = 200; b = 220; };
      transparency = 0.5; refractiveIndex = 1.2;
      reflectivity = 0.3; shininess = 50.0;
      rotation = { x = 20.0; y = 0.0; z = 30.0; };
    }
  );

  objs = (
    # Fusee principale - rouge-orange vibrant retro-futur (debout verticalement)
    {
      filepath = "models/rocket.obj";
      x = 12.0; y = -15.0; z = -5.0;
      color = { r = 245; g = 60; b = 30; };
      reflectivity = 0.15; shininess = 40.0;
      scale = { x = 2.0; y = 2.0; z = 2.0; };
      rotation = { x = 90.0; y = 0.0; z = -15.0; };
    },
    # Deuxieme fusee - blanc titane futuriste (debout verticalement)
    {
      filepath = "models/rocket.obj";
      x = -15.0; y = 10.0; z = -12.0;
      color = { r = 245; g = 245; b = 250; };
      reflectivity = 0.25; shininess = 60.0;
      scale = { x = 1.3; y = 1.3; z = 1.3; };
      rotation = { x = 90.0; y = 0.0; z = 10.0; };
    }
  );
};

lights:
{
  ambient = 0.25;
  diffuse = 0.75;
  point = (
    # Lumiere solaire chaude venant de loin
    { x = 300.0; y = -200.0; z = 250.0; color = { r = 255; g = 245; b = 220; }; },
    # Lumiere bleutee de reflet planetaire
    { x = -100.0; y =  100.0; z = 150.0; color = { r = 100; g = 150; b = 255; }; },
    # Lumiere de rampe de lancement orange intense et proche
    { x = -10.0; y = -60.0; z =  5.0; color = { r = 255; g = 120; b = 30; }; },
    # Projecteur blanc frontal puissant et proche pour reveler les details
    { x =  30.0; y = -70.0; z = 15.0; color = { r = 255; g = 255; b = 255; }; }
  );
  directional = ();
};
