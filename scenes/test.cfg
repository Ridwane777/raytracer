# Scene de test - RayTracer Ridwane777
# Une sphere rouge, un plan gris, lumiere ambiante + directionnelle

camera:
{
    resolution = { width = 800; height = 450; };
    position   = { x = 0.0; y = 1.0; z = 5.0; };
    rotation   = { x = 0.0; y = 0.0; z = 0.0; };
    fieldOfView = 72;
};

primitives:
{
    spheres = (
        # Sphere rouge, centree dans la scene
        { x = 0.0; y = 1.0; z = -1.0; r = 1.0; color = { r = 230; g = 50;  b = 50;  }; },
        # Petite sphere bleue, a droite
        { x = 2.5; y = 0.8; z = -2.0; r = 0.8; color = { r = 50;  g = 100; b = 220; }; },
        # Sphere verte, a gauche
        { x = -2.0; y = 1.0; z = -1.5; r = 0.9; color = { r = 60;  g = 200; b = 80;  }; }
    );

    planes = (
        # Plan sol horizontal (axe Y = 0)
        { axis = "Y"; position = 0.0; color = { r = 180; g = 180; b = 180; }; }
    );
};

lights:
{
    ambient = 0.2;
    diffuse = 0.8;

    directional = (
        # Lumiere venant du haut-droite-avant
        { x = -1.0; y = -2.0; z = -1.0; }
    );
};
