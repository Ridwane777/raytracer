camera:
{
    resolution: { width = 1000; height = 800; };
    position: { x = 0.0; y = 10.0; z = 25.0; }; // Looking down slightly
    rotation: { x = -15.0; y = 0.0; z = 0.0; };
    fieldOfView = 60.0;
    antialiasing = 1;
};

primitives:
{
    planes = (
        {
            axis = "Y";
            position = 0.0; // Le sol
            color = { r = 100; g = 100; b = 100; }; // Gris
            reflectivity = 0.8; // Un miroir presque parfait (80%)
        }
    );
    spheres = (
        {
            x = -5.0; y = 3.0; z = 0.0;
            r = 3.0;
            color = { r = 255; g = 50; b = 50; }; // Rouge
        },
        {
            x = 5.0; y = 4.0; z = -5.0;
            r = 4.0;
            color = { r = 50; g = 255; b = 50; }; // Verte
        },
        {
            x = 0.0; y = 2.0; z = 10.0;
            r = 2.0;
            color = { r = 50; g = 50; b = 255; }; // Bleue
        }
    );
};

lights:
{
    ambient = 0.2;
    diffuse = 0.8;
    point = (
        {
            x = 0.0; y = 20.0; z = 10.0;
            color = { r = 255; g = 255; b = 255; };
        }
    );
};
