camera: {
    resolution: { width: 800, height: 600 };
    position: { x: 0.0, y: 1.0, z: 0.0 };
    rotation: { x: 0.0, y: 0.0, z: 0.0 };
    fieldOfView: 60.0;
    antialiasing: 2;
};

primitives: {
    spheres: (
        { 
            x: -5.0, y: 0.0, z: -15.0, r: 2.0, 
            color: { r: 255, g: 50, b: 50 } # Sphere Rouge
        }
    );
    cylinders: (
        { 
            x: 0.0, y: -2.0, z: -15.0, r: 1.5, height: 4.0,
            color: { r: 50, g: 255, b: 50 } # Cylindre Vert
        }
    );
    cones: (
        { 
            x: 5.0, y: -2.0, z: -15.0, r: 1.5, height: 4.0, angle: 30.0,
            color: { r: 50, g: 50, b: 255 } # Cône Bleu
        }
    );
    planes: (
        { 
            axis: "Y", position: -2.0, 
            color: { r: 150, g: 150, b: 150 },
            reflectivity: 0.2
        }
    );
};

lights: {
    ambient: 0.3;
    point: (
        { x: 0.0, y: 10.0, z: -5.0, intensity: 1.0, color: { r: 255, g: 255, b: 255 } }
    );
};
