camera:
{
    resolution: { width = 1920; height = 1080; };
    position: { x = 0.0; y = 0.0; z = -12.0; };
    rotation: { x = 0.0; y = 0.0; z = 0.0; };
    fieldOfView = 60.0;
    antialiasing = 1;
};

primitives:
{
    // A transparent plane (like a glass sheet) in front
    planes = (
        {
            axis = "Z";
            position = -15.0;
            color = { r = 255; g = 255; b = 255; };
            transparency = 0.8; // 80% transparent
        },
        // Floor
        {
            axis = "Y";
            position = -2.0;
            color = { r = 100; g = 100; b = 100; };
        }
    );

    // A sphere behind the glass sheet
    spheres = (
        {
            x = 0.0; y = 0.0; z = -20.0;
            r = 2.0;
            color = { r = 255; g = 255; b = 255; }; // White sphere
        }
    );
};

lights:
{
    ambient = 0.2;
    diffuse = 0.8;
    point = (
        {
            x = 5.0; y = 5.0; z = -5.0;
            // Blue light
            color = { r = 0; g = 0; b = 255; };
        },
        {
            x = -5.0; y = 5.0; z = -5.0;
            // Red light
            color = { r = 255; g = 0; b = 0; };
        }
    );
};
