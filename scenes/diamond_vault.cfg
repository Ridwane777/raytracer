# Scene 3: Diamond Vault
# Collection de diamants low-poly sur sol miroir noir
camera:
{
  resolution = { width = 1920; height = 1080; };
  position = { x = 0.0; y = -120.0; z = 30.0; };
  rotation = { x = 76.0; y = 0.0; z = 0.0; };
  fieldOfView = 52.0;
  antialiasing = 4;
};

primitives:
{
  planes = (
    # Sol miroir noir absolu
    { axis = "Z"; position = -25.0; color = { r = 8; g = 8; b = 12; }; reflectivity = 0.75; shininess = 60.0; },
    # Mur fond sombre
    { axis = "Y"; position = 140.0; color = { r = 12; g = 8; b = 20; }; reflectivity = 0.0; }
  );

  objs = (
    # Diamant central - incolore (brillance maximale)
    {
      filepath = "models/diamond.obj";
      x = 0.0; y = 10.0; z = 0.0;
      color = { r = 240; g = 245; b = 255; };
      transparency = 0.9; refractiveIndex = 2.42;
      reflectivity = 0.4; shininess = 120.0;
      scale = { x = 2.5; y = 2.5; z = 2.5; };
      rotation = { x = 0.0; y = 45.0; z = 0.0; };
    },
    # Diamant gauche - saphir bleu
    {
      filepath = "models/diamond.obj";
      x = -38.0; y = 20.0; z = -10.0;
      color = { r = 40; g = 100; b = 255; };
      transparency = 0.80; refractiveIndex = 1.77;
      reflectivity = 0.35; shininess = 100.0;
      scale = { x = 1.6; y = 1.6; z = 1.6; };
      rotation = { x = 0.0; y = 30.0; z = 12.0; };
    },
    # Diamant droit - emeraude verte
    {
      filepath = "models/diamond.obj";
      x = 38.0; y = 20.0; z = -10.0;
      color = { r = 50; g = 220; b = 100; };
      transparency = 0.75; refractiveIndex = 1.58;
      reflectivity = 0.30; shininess = 90.0;
      scale = { x = 1.6; y = 1.6; z = 1.6; };
      rotation = { x = 0.0; y = -30.0; z = -12.0; };
    },
    # Petit diamant avant gauche - rubis
    {
      filepath = "models/diamond.obj";
      x = -18.0; y = 45.0; z = -20.0;
      color = { r = 255; g = 30; b = 60; };
      transparency = 0.70; refractiveIndex = 1.76;
      reflectivity = 0.25; shininess = 80.0;
      scale = { x = 1.0; y = 1.0; z = 1.0; };
      rotation = { x = 0.0; y = 20.0; z = 8.0; };
    },
    # Petit diamant avant droit - topaze or
    {
      filepath = "models/diamond.obj";
      x = 18.0; y = 45.0; z = -20.0;
      color = { r = 255; g = 200; b = 50; };
      transparency = 0.70; refractiveIndex = 1.62;
      reflectivity = 0.25; shininess = 80.0;
      scale = { x = 1.0; y = 1.0; z = 1.0; };
      rotation = { x = 0.0; y = -20.0; z = -8.0; };
    }
  );
};

lights:
{
  ambient = 0.40;
  diffuse = 0.60;
  point = (
    # Spot blanc central intense - proche et puissant
    { x =   0.0; y = -60.0; z = 100.0; color = { r = 255; g = 255; b = 255; }; },
    # Spot frontal bas - eclaire directement les facettes
    { x =   0.0; y = -30.0; z =  60.0; color = { r = 255; g = 245; b = 230; }; },
    # Accent bleu cote gauche - rapproche
    { x = -70.0; y = -40.0; z =  70.0; color = { r = 160; g = 200; b = 255; }; },
    # Accent rose/magenta cote droit - rapproche
    { x =  70.0; y = -40.0; z =  70.0; color = { r = 255; g = 160; b = 220; }; }
  );
  directional = ();
};
