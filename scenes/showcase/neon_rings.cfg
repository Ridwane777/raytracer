# Interlocking rings lit by magenta and cyan neon lights.
camera:
{
    resolution = { width = 1920; height = 1080; };
    position = { x = 0.0; y = 14.0; z = 75.0; };
    rotation = { x = -10.0; y = 0.0; z = 0.0; };
    fieldOfView = 50.0;
    antialiasing = 4;
};
background:
{
    top    = { r = 5;  g = 5;  b = 15; };
    bottom = { r = 40; g = 10; b = 50; };
};
primitives:
{
    toruses = (
        { x = -8.0; y = 12.0; z = 0.0; r1 = 12.0; r2 = 1.8; color = { r = 230; g = 230; b = 240; };
          reflectivity = 0.55; shininess = 180.0; rotation = { x = 90.0; y = 0.0; z = 0.0; }; },
        { x = 8.0; y = 12.0; z = 0.0; r1 = 12.0; r2 = 1.8; color = { r = 230; g = 230; b = 240; };
          reflectivity = 0.55; shininess = 180.0; rotation = { x = 0.0; y = 0.0; z = 90.0; }; },
        { x = 0.0; y = 0.0; z = 0.0; r1 = 26.0; r2 = 1.0; color = { r = 255; g = 60; b = 200; };
          reflectivity = 0.3; shininess = 100.0; }
    );
    spheres = (
        { x = 0.0; y = 12.0; z = 0.0; r = 4.0; color = { r = 255; g = 255; b = 255; };
          transparency = 0.85; refractiveIndex = 1.45; shininess = 300.0; }
    );
    planes = (
        { axis = "Y"; position = -2.0; color = { r = 20; g = 20; b = 30; }; reflectivity = 0.6; shininess = 80.0; }
    );
};
lights:
{
    ambient = 0.05;
    diffuse = 0.9;
    point = (
        { x = -45.0; y = 30.0; z = 30.0; color = { r = 255; g = 40;  b = 200; }; },
        { x = 45.0;  y = 30.0; z = 30.0; color = { r = 40;  g = 220; b = 255; }; },
        { x = 0.0;   y = 60.0; z = -20.0; color = { r = 90; g = 60;  b = 160; }; }
    );
};
