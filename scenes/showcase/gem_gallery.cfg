# Museum gallery: a diamond and a crystal on pedestals, each under its own colored light.
camera:
{
    resolution = { width = 1920; height = 1080; };
    position = { x = 0.0; y = 18.0; z = 70.0; };
    rotation = { x = -10.0; y = 0.0; z = 0.0; };
    fieldOfView = 50.0;
    antialiasing = 4;
};
background:
{
    top    = { r = 0;  g = 0;  b = 0;  };
    bottom = { r = 25; g = 20; b = 30; };
};
primitives:
{
    cylinders = (
        { x = -18.0; y = -10.0; z = 0.0; r = 6.0; height = 16.0; color = { r = 235; g = 230; b = 220; }; shininess = 30.0; },
        { x = 18.0;  y = -10.0; z = 0.0; r = 6.0; height = 16.0; color = { r = 235; g = 230; b = 220; }; shininess = 30.0; }
    );
    objs = (
        { filepath = "models/diamond.obj"; x = -18.0; y = 16.0; z = 0.0; color = { r = 200; g = 230; b = 255; };
          transparency = 0.6; refractiveIndex = 2.4; reflectivity = 0.3; shininess = 250.0; scale = { x = 0.9; y = 0.9; z = 0.9; }; rotation = { x = 0.0; y = 25.0; z = 0.0; }; },
        { filepath = "models/crystal.obj"; x = 18.0; y = 14.0; z = 0.0; color = { r = 190; g = 90; b = 255; };
          reflectivity = 0.3; shininess = 200.0; scale = { x = 1.0; y = 1.0; z = 1.0; }; rotation = { x = 0.0; y = 15.0; z = 0.0; }; }
    );
    spheres = (
        { x = 0.0; y = -5.0; z = 15.0; r = 5.0; color = { r = 230; g = 230; b = 235; }; reflectivity = 0.9; shininess = 200.0; }
    );
    planes = (
        { axis = "Y"; position = -10.0; color = { r = 40; g = 35; b = 45; }; reflectivity = 0.35; shininess = 60.0; },
        { axis = "Z"; position = -40.0; color = { r = 30; g = 22; b = 30; }; }
    );
};
lights:
{
    ambient = 0.08;
    diffuse = 0.9;
    point = (
        { x = -18.0; y = 45.0; z = 25.0; color = { r = 150; g = 200; b = 255; }; },
        { x = 18.0;  y = 45.0; z = 25.0; color = { r = 220; g = 120; b = 255; }; },
        { x = 0.0;   y = 20.0; z = 60.0; color = { r = 90;  g = 80;  b = 70;  }; }
    );
};
