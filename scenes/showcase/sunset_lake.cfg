# Sunset over a mirror lake: a warm sky gradient reflected by a glossy plane.
camera:
{
    resolution = { width = 1920; height = 1080; };
    position = { x = 0.0; y = 6.0; z = 70.0; };
    rotation = { x = -4.0; y = 0.0; z = 0.0; };
    fieldOfView = 55.0;
    antialiasing = 4;
};
background:
{
    top    = { r = 20;  g = 24;  b = 70;  };
    bottom = { r = 255; g = 120; b = 60;  };
};
primitives:
{
    spheres = (
        # chrome ball
        { x = -16.0; y = 6.0; z = -10.0; r = 9.0; color = { r = 230; g = 230; b = 235; };
          reflectivity = 0.9; shininess = 200.0; },
        # glass ball
        { x = 10.0; y = 4.0; z = 5.0; r = 7.0; color = { r = 255; g = 255; b = 255; };
          transparency = 0.9; refractiveIndex = 1.5; shininess = 300.0; },
        # small gold ball
        { x = 26.0; y = 0.0; z = -20.0; r = 3.0; color = { r = 255; g = 190; b = 60; };
          reflectivity = 0.5; shininess = 120.0; specular = { r = 255; g = 220; b = 150; }; }
    );
    toruses = (
        { x = 30.0; y = 10.0; z = -40.0; r1 = 12.0; r2 = 1.6; color = { r = 255; g = 170; b = 70; };
          reflectivity = 0.6; shininess = 150.0; rotation = { x = 90.0; y = -30.0; z = 0.0; }; }
    );
    planes = (
        # the lake
        { axis = "Y"; position = -3.0; color = { r = 30; g = 40; b = 70; }; reflectivity = 0.75; shininess = 60.0; }
    );
};
lights:
{
    ambient = 0.15;
    diffuse = 0.85;
    directional = (
        # low sun behind the scene, shining toward the camera
        { x = 0.2; y = -0.25; z = 1.0; color = { r = 255; g = 170; b = 110; }; }
    );
    point = (
        { x = -40.0; y = 50.0; z = 60.0; color = { r = 120; g = 130; b = 200; }; }
    );
};
