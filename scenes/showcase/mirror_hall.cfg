# Two facing mirrors repeat a row of glass and colored balls to infinity.
# Render with a higher recursion depth: ./raytracer scenes/showcase/mirror_hall.cfg --depth 10
camera:
{
    resolution = { width = 1920; height = 1080; };
    position = { x = 6.0; y = 10.0; z = 60.0; };
    rotation = { x = -8.0; y = 12.0; z = 0.0; };
    fieldOfView = 60.0;
    antialiasing = 4;
};
background:
{
    color = { r = 10; g = 10; b = 20; };
};
primitives:
{
    planes = (
        { axis = "X"; position = -25.0; color = { r = 200; g = 210; b = 230; }; reflectivity = 0.92; shininess = 200.0; },
        { axis = "X"; position =  25.0; color = { r = 200; g = 210; b = 230; }; reflectivity = 0.92; shininess = 200.0; },
        { axis = "Y"; position = -6.0;  color = { r = 60;  g = 50;  b = 45;  }; reflectivity = 0.2; shininess = 30.0; }
    );
    spheres = (
        { x = -10.0; y = 0.0; z = 0.0;   r = 6.0; color = { r = 230; g = 50;  b = 60;  }; shininess = 80.0; reflectivity = 0.1; },
        { x = 0.0;   y = 0.0; z = -15.0; r = 6.0; color = { r = 255; g = 255; b = 255; }; transparency = 0.9; refractiveIndex = 1.5; shininess = 300.0; },
        { x = 10.0;  y = 0.0; z = -30.0; r = 6.0; color = { r = 60;  g = 120; b = 240; }; shininess = 80.0; reflectivity = 0.1; },
        { x = 0.0;   y = -3.0; z = 10.0; r = 3.0; color = { r = 255; g = 200; b = 60;  }; shininess = 120.0; reflectivity = 0.6; }
    );
    cylinders = (
        { x = 0.0; y = -6.0; z = -50.0; r = 3.0; height = 30.0; color = { r = 240; g = 235; b = 220; }; shininess = 40.0; }
    );
};
lights:
{
    ambient = 0.12;
    diffuse = 0.85;
    point = (
        { x = 0.0;  y = 30.0; z = 20.0;  color = { r = 255; g = 230; b = 200; }; },
        { x = 15.0; y = 15.0; z = -40.0; color = { r = 120; g = 160; b = 255; }; }
    );
};
