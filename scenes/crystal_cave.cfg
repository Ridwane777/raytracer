# Scene 1: Crystal Cave
# Cristaux hexagonaux refractifs sous eclairage dramatique
camera:
{
  resolution = { width = 1920; height = 1080; };
  position = { x = 0.0; y = -140.0; z = 35.0; };
  rotation = { x = 78.0; y = 0.0; z = 0.0; };
  fieldOfView = 55.0;
  antialiasing = 4;
};

primitives:
{
  planes = (
    { axis = "Z"; position = -25.0; color = { r = 10; g = 10; b = 20; }; reflectivity = 0.55; shininess = 40.0; },
    { axis = "X"; position = -80.0; color = { r = 15; g = 10; b = 25; }; reflectivity = 0.15; },
    { axis = "X"; position =  80.0; color = { r = 15; g = 10; b = 25; }; reflectivity = 0.15; }
  );

  objs = (
    # Grand cristal central - glace bleue
    {
      filepath = "models/crystal.obj";
      x = 0.0; y = 20.0; z = 0.0;
      color = { r = 100; g = 200; b = 255; };
      transparency = 0.80; refractiveIndex = 1.45;
      reflectivity = 0.25; shininess = 90.0;
      scale = { x = 2.5; y = 2.5; z = 2.5; };
      rotation = { x = 0.0; y = 0.0; z = 15.0; };
    },
    # Cristal gauche - emeraude
    {
      filepath = "models/crystal.obj";
      x = -35.0; y = 30.0; z = -15.0;
      color = { r = 50; g = 255; b = 120; };
      transparency = 0.70; refractiveIndex = 1.58;
      reflectivity = 0.20; shininess = 70.0;
      scale = { x = 1.4; y = 1.8; z = 1.4; };
      rotation = { x = 0.0; y = 0.0; z = -20.0; };
    },
    # Cristal droit - rubis
    {
      filepath = "models/crystal.obj";
      x = 38.0; y = 25.0; z = -18.0;
      color = { r = 255; g = 60; b = 80; };
      transparency = 0.65; refractiveIndex = 1.76;
