# Scene: Cube Trio
# Deux cubes opaques colores et un cube central transparent hautement refractif
camera:
{
  resolution = { width = 1920; height = 1080; };
  position = { x = 0.0; y = -110.0; z = 25.0; };
  rotation = { x = 76.0; y = 0.0; z = 0.0; };
  fieldOfView = 55.0;
  antialiasing = 4;
};

primitives:
{
  planes = (
    # Sol miroir sombre
    { axis = "Z"; position = -25.0; color = { r = 15; g = 15; b = 22; }; reflectivity = 0.65; shininess = 50.0; },
    # Mur de fond lointain
    { axis = "Y"; position = 150.0; color = { r = 10; g = 8; b = 15; }; }
  );

  objs = (
    # Cube gauche - Turquoise opaque
    {
      filepath = "models/cube.obj";
      x = -32.0; y = 20.0; z = -15.0;
      color = { r = 0; g = 180; b = 200; };
      reflectivity = 0.2; shininess = 40.0;
      scale = { x = 1.0; y = 1.0; z = 1.0; };
      rotation = { x = 0.0; y = 0.0; z = 25.0; };
    },
    # Cube droit - Rose Magenta opaque
    {
      filepath = "models/cube.obj";
      x = 32.0; y = 20.0; z = -15.0;
      color = { r = 240; g = 40; b = 120; };
      reflectivity = 0.2; shininess = 40.0;
      scale = { x = 1.0; y = 1.0; z = 1.0; };
      rotation = { x = 0.0; y = 0.0; z = -35.0; };
    },
    # Cube central - Transparent en verre refractif
    {
      filepath = "models/cube.obj";
      x = 0.0; y = 0.0; z = -13.0;
      color = { r = 255; g = 255; b = 255; };
      transparency = 0.85; refractiveIndex = 1.52;
      reflectivity = 0.25; shininess = 90.0;
      scale = { x = 1.2; y = 1.2; z = 1.2; };
      rotation = { x = 15.0; y = 15.0; z = 45.0; };
    }
  );
};

lights:
{
  ambient = 0.20;
  diffuse = 0.80;
  point = (
    # Projecteur principal blanc neutre
    { x =   0.0; y = -70.0; z = 120.0; color = { r = 255; g = 255; b = 255; }; },
    # Spot bleu/violet a gauche
    { x = -80.0; y = -40.0; z =  60.0; color = { r = 120; g = 160; b = 255; }; },
    # Spot orange a droite
    { x =  80.0; y = -40.0; z =  60.0; color = { r = 255; g = 150; b = 50; }; }
  );
  directional = ();
};
