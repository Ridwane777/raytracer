lights:
{
  ambient = 0.30;
  diffuse = 0.70;
  point = (
    # Spot superieur blanc
    { x =  40.0; y = -60.0; z = 100.0; color = { r = 255; g = 255; b = 255; }; },
    # Spot lateral chaud
    { x = -50.0; y = -30.0; z =  40.0; color = { r = 255; g = 220; b = 180; }; },
    # Remplissage doux pour deboucher les ombres
    { x =   0.0; y =  80.0; z =  50.0; color = { r = 180; g = 200; b = 255; }; }
  );
  directional = ();
