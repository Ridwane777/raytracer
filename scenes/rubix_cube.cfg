# Scene: Scrambled Rubik's Cube 3x3
# Compose de 27 cubes individuels avec la couche superieure pivotee de 25 degres
camera:
{
  resolution = { width = 1920; height = 1080; };
  position = { x = 22.0; y = -90.0; z = 12.0; };
  rotation = { x = 75.0; y = 0.0; z = -15.0; };
  fieldOfView = 50.0;
  antialiasing = 4;
};

primitives:
{
  planes = (
    # Sol miroir noir de luxe
    { axis = "Z"; position = -25.0; color = { r = 12; g = 12; b = 16; }; reflectivity = 0.70; shininess = 60.0; }
  );

  objs = (
    # ==================== COUCHE INFERIEURE (k = -1, z = -16.3) ====================
    { filepath = "models/cube.obj"; x = -6.3; y =  8.7; z = -16.3; color = { r = 220; g = 20;  b = 20;  }; scale = { x = 0.3; y = 0.3; z = 0.3; }; }, # ROUGE
    { filepath = "models/cube.obj"; x =  0.0; y =  8.7; z = -16.3; color = { r = 20;  g = 60;  b = 220; }; scale = { x = 0.3; y = 0.3; z = 0.3; }; }, # BLEU
    { filepath = "models/cube.obj"; x =  6.3; y =  8.7; z = -16.3; color = { r = 230; g = 210; b = 10;  }; scale = { x = 0.3; y = 0.3; z = 0.3; }; }, # JAUNE

    { filepath = "models/cube.obj"; x = -6.3; y = 15.0; z = -16.3; color = { r = 240; g = 100; b = 10;  }; scale = { x = 0.3; y = 0.3; z = 0.3; }; }, # ORANGE
