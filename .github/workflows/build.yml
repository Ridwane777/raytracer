name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libconfig++-dev libsfml-dev

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Render a sample scene
        run: |
          ./raytracer scenes/simple_scene.cfg
          test -s output.ppm
          ./raytracer scenes/showcase/sunset_lake.cfg --res 320x180 -o showcase.ppm
          test -s showcase.ppm
